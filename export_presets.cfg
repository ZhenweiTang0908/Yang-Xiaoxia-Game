[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/animation/*.json,assets/art/knight_frames/*/*.json"
exclude_filter="tools/*,docs/*,builds/*,.venv/*,tests/*,art_source/*"
export_path="builds/web/index.html"

[preset.0.options]
custom_template/debug="builds/templates/web_nothreads_debug.zip"
custom_template/release="builds/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/animation/*.json,assets/art/knight_frames/*/*.json"
exclude_filter="tools/*,docs/*,builds/*,.venv/*,tests/*,art_source/*"
export_path="builds/macos/YangDaxia.zip"

[preset.1.options]
custom_template/debug="builds/templates/macos.zip"
custom_template/release="builds/templates/macos.zip"
application/bundle_identifier="local.yangdaxia.demo"
application/short_version="0.2.0"
application/version="0.2.0"
application/category="Games"
codesign/codesign=1
codesign/identity="-"
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.2]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/animation/*.json,assets/art/knight_frames/*/*.json"
exclude_filter="tools/*,docs/*,builds/*,.venv/*,tests/*,art_source/*"
export_path="builds/android/YangDaxia.apk"

[preset.2.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
package/unique_name="local.yangdaxia.demo"
package/name="羊大侠"
version/code=1
version/name="0.2.0"
screen/immersive_mode=true
permissions/internet=false
